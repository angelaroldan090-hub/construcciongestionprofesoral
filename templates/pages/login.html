<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Gestión Profesoral</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .login-card {
            max-width: 420px;
            margin: 80px auto;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,.1);
        }
        .login-header {
            background: #212529;
            color: #fff;
            padding: 28px 32px 20px;
            border-radius: 12px 12px 0 0;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="login-card card border-0">
    <div class="login-header">
        <i class="fas fa-chalkboard-user fa-2x mb-2"></i>
        <h4 class="mb-0">Gestión Profesoral</h4>
        <small class="text-white-50">Ingrese sus credenciales</small>
    </div>
    <div class="card-body p-4">

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.login_post') }}">
            <div class="mb-3">
                <label for="email" class="form-label fw-semibold">
                    <i class="fas fa-envelope me-1"></i> Correo electrónico
                </label>
                <input type="email" class="form-control" id="email" name="email"
                       placeholder="usuario@correo.com" required autofocus>
            </div>
            <div class="mb-4">
                <label for="contrasena" class="form-label fw-semibold">
                    <i class="fas fa-lock me-1"></i> Contraseña
                </label>
                <input type="password" class="form-control" id="contrasena" name="contrasena"
                       placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-dark w-100">
                <i class="fas fa-sign-in-alt me-1"></i> Iniciar Sesión
            </button>
        </form>

        <div class="text-center mt-3">
            <a href="{{ url_for('auth.recuperar_contrasena') }}" class="text-muted small">
                ¿Olvidaste tu contraseña?
            </a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
