{% extends "layout/base.html" %}

{% block title %}Redes{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
        <h3 class="mb-0"><i class="fas fa-network-wired"></i> Redes</h3>
        <button class="btn btn-light btn-sm" onclick="mostrarFormulario()">
            <i class="fas fa-plus"></i> Nueva Red
        </button>
    </div>
    <div class="card-body">
        <!-- Formulario unificado -->
        <div id="formularioRed" style="display: none;" class="mb-4 border p-3 rounded">
            <h4 id="formTitulo">Nueva Red</h4>
            <form method="POST" id="redForm">
                <input type="hidden" id="editId" name="editId">
                <div class="mb-2"><label>ID *</label><input type="number" class="form-control" id="idr" name="idr" required></div>
                <div class="mb-2"><label>Nombre *</label><input type="text" class="form-control" id="nombre" name="nombre" required></div>
                <div class="mb-2"><label>URL *</label><input type="url" class="form-control" id="url" name="url" required></div>
                <div class="mb-2"><label>País *</label><input type="text" class="form-control" id="pais" name="pais" required></div>
                <div class="text-center">
                    <button type="submit" class="btn btn-primary">Guardar</button>
                    <button type="button" class="btn btn-secondary" onclick="ocultarFormulario()">Cancelar</button>
                </div>
            </form>
        </div>
        
        <!-- Tabla de listado -->
        <div class="table-responsive">
            <table class="table table-striped">
                <thead><tr><th>ID</th><th>Nombre</th><th>URL</th><th>País</th><th>Acciones</th></tr></thead>
                <tbody>
                    {% for red in redes %}
                    <tr>
                        <td>{{ red.idr }}</td>
                        <td>{{ red.nombre }}</td>
                        <td><a href="{{ red.url }}" target="_blank">{{ red.url[:30] }}</a></td>
                        <td>{{ red.pais }}</td>
                        <td>
                            <button class="btn btn-sm btn-warning" onclick="editarRed({{ red.idr }})"><i class="fas fa-edit"></i></button>
                            <button class="btn btn-sm btn-danger" onclick="eliminarRed({{ red.idr }})"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
const _redesMap = {};
{{ redes|tojson }}.forEach(r => { _redesMap[String(r.idr)] = r; });

function mostrarFormulario() {
    document.getElementById('formularioRed').style.display='block';
    document.getElementById('formTitulo').innerText='Nueva Red';
    document.getElementById('redForm').reset();
    document.getElementById('editId').value='';
}

function ocultarFormulario() {
    document.getElementById('formularioRed').style.display='none';
}

function editarRed(idr) {
    const data = _redesMap[String(idr)];
    if (!data) { alert('No se encontró la red.'); return; }
    document.getElementById('editId').value=data.idr;
    document.getElementById('idr').value=data.idr;
    document.getElementById('nombre').value=data.nombre;
    document.getElementById('url').value=data.url;
    document.getElementById('pais').value=data.pais;
    document.getElementById('formTitulo').innerText='Editar Red';
    document.getElementById('formularioRed').style.display='block';
}

function eliminarRed(idr) {
    if(confirm('¿Está seguro?')) window.location.href=`/red/eliminar/${idr}`;
}

document.getElementById('redForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const editId=document.getElementById('editId').value;
    const url=editId?`/red/editar/${editId}`:'/red/crear';
    fetch(url,{method:'POST',body:new FormData(this)}).then(()=>{window.location.reload();});
});
</script>
{% endblock %}
