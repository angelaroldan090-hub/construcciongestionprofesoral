<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Contraseña - Gestión Profesoral</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card-form {
            max-width: 440px;
            margin: 80px auto;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,.1);
        }
        .card-header-dark {
            background: #212529;
            color: #fff;
            padding: 24px 32px 16px;
            border-radius: 12px 12px 0 0;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="card-form card border-0">
    <div class="card-header-dark">
        <i class="fas fa-key fa-2x mb-2"></i>
        <h5 class="mb-0">Cambiar Contraseña</h5>
        <small class="text-white-50">Crea una nueva contraseña segura</small>
    </div>
    <div class="card-body p-4">

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endwith %}

        <div class="alert alert-info small mb-3">
            <i class="fas fa-info-circle me-1"></i>
            La contraseña debe tener al menos <strong>6 caracteres</strong>,
            una <strong>mayúscula</strong> y un <strong>número</strong>.
        </div>

        <form method="POST" action="{{ url_for('auth.cambiar_contrasena_post') }}">
            <div class="mb-3">
                <label for="nueva" class="form-label fw-semibold">
                    <i class="fas fa-lock me-1"></i> Nueva contraseña
                </label>
                <input type="password" class="form-control" id="nueva" name="nueva"
                       placeholder="••••••••" required>
            </div>
            <div class="mb-4">
                <label for="confirmar" class="form-label fw-semibold">
                    <i class="fas fa-lock me-1"></i> Confirmar contraseña
                </label>
                <input type="password" class="form-control" id="confirmar" name="confirmar"
                       placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-dark w-100">
                <i class="fas fa-save me-1"></i> Guardar nueva contraseña
            </button>
        </form>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
